<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limitless Wolves — FLL</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#071021;
  --card:#0f1724;
  --muted:#9aa7b8;
  --accent:#6be04a;
}

body{
  margin:0;
  font-family:Inter,system-ui;
  background:var(--bg);
  color:#e6f0ff;
  padding:30px;
}

.site{max-width:1100px;margin:auto}

/* HEADER */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  text-decoration:none;
  color:white;
}

.logo img{
  width:52px;
  height:52px;
  border-radius:12px;
  object-fit:cover;
}

nav{
  display:flex;
  gap:14px;
}

nav a{
  text-decoration:none;
  color:var(--muted);
  font-weight:600;
}

nav a:hover{color:var(--accent)}

/* MOBILE MENU */
.hamburger{
  display:none;
  width:44px;
  height:44px;
  border-radius:10px;
  background:#111;
  color:white;
  border:0;
  font-size:22px;
}

.mobile-menu{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.7);
  display:none;
  justify-content:flex-end;
}

.mobile-panel{
  width:260px;
  background:var(--card);
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.mobile-panel a{
  color:white;
  text-decoration:none;
  font-size:18px;
}

/* HERO */
.hero{
  background:var(--card);
  padding:25px;
  border-radius:16px;
}

/* CARD */
.card{
  background:var(--card);
  padding:18px;
  border-radius:12px;
  margin-top:16px;
}

/* GALLERY */
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
  margin-top:12px;
}

.gallery img{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:10px;
  cursor:pointer;
  transition:.25s;
}

.gallery img:hover{transform:scale(1.05)}

.lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  display:none;
  align-items:center;
  justify-content:center;
}

.lightbox img{
  max-width:90%;
  max-height:90%;
}

/* MOBILE */
@media(max-width:800px){
  nav{display:none}
  .hamburger{display:block}
}
</style>
</head>

<body>

<div class="site">

<header>
  <a class="logo" href="index.html">
    <img src="images/logo.png">
    <div>
      <strong>LIMITLESS WOLVES</strong>
      <div style="font-size:12px;color:var(--muted)">FLL Takımı</div>
    </div>
  </a>

  <nav>
    <a href="index.html">Ana Sayfa</a>
    <a href="#team">Takım</a>
    <a href="#gallery">Galeri</a>
    <a href="project.html">Projeler</a>
  </nav>

  <button class="hamburger" id="hamb">☰</button>
</header>

<div class="mobile-menu" id="mobileMenu">
  <div class="mobile-panel">
    <a href="index.html">Ana Sayfa</a>
    <a href="#team">Takım</a>
    <a href="#gallery">Galeri</a>
    <a href="project.html">Projeler</a>
  </div>
</div>

<section class="hero">
<h2>Limitless Wolves — FLL Takımı</h2>
<p>Algoritma, mekanik ve takım ruhu.</p>
</section>

<div class="card" id="team">
<h3>Takım</h3>
<p>Mühendislik ve yaratıcılığı birleştiren FLL ekibi.</p>
</div>

<div class="card" id="gallery">
<h3>Galeri</h3>
<div class="gallery">
<img src="images/gallery1.jpg">
<img src="images/gallery2.jpg">
<img src="images/gallery3.jpg">
</div>
</div>

</div>

<div class="lightbox" id="lightbox">
<img id="lightboxImg">
</div>

<script>

/* MOBILE MENU */
const hamb=document.getElementById("hamb")
const menu=document.getElementById("mobileMenu")

hamb.onclick=()=>menu.style.display="flex"
menu.onclick=e=>{ if(e.target===menu) menu.style.display="none" }
document.addEventListener("keydown",e=>{ if(e.key==="Escape") menu.style.display="none" })

/* LIGHTBOX */
const lb=document.getElementById("lightbox")
const lbImg=document.getElementById("lightboxImg")

document.querySelectorAll(".gallery img").forEach(img=>{
 img.onclick=()=>{
   lb.style.display="flex"
   lbImg.src=img.src
 }
})

lb.onclick=()=>lb.style.display="none"

</script>

</body>
</html>
